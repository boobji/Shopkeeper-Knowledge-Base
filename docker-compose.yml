# =============================================================================
#  掌柜智库 ShopKeeper Knowledge Base —— 外部依赖服务编排
# -----------------------------------------------------------------------------
#  本文件只负责拉起项目依赖的 4 个基础服务，应用本身仍在本地运行：
#    - Milvus   向量库（含 etcd + 专用对象存储，共 3 个容器）
#    - Neo4j    知识图谱
#    - MongoDB  会话历史
#    - MinIO    图片 / 文件对象存储
#
#  快速开始：
#    docker compose up -d                 # 启动（在项目根目录执行）
#    docker compose ps                    # 查看状态，等待全部 healthy
#    python scripts/check_env.py          # 自检四个服务是否连通
#
#  复用已有的 knowledge/.env（不必重复填密码）：
#    docker compose --env-file knowledge/.env up -d
#
#  所有配置均可用环境变量覆盖，默认值已与 .env.example 对齐，开箱即用。
#  注意：这是本地开发环境配置，默认口令仅供开发使用，请勿直接用于生产。
# =============================================================================

name: shopkeeper-kb

services:
  # ===========================================================================
  #  1. Milvus 向量库
  #     版本说明：Milvus 服务端必须与 pymilvus 客户端 minor 版本保持一致。
  #     本项目 requirements.txt 使用 pymilvus[model]（当前 3.0.x），
  #     故服务端固定为 v3.0.0。切勿随意降级到 2.5/2.6，会导致 gRPC 协议不匹配。
  # ===========================================================================

  # 1.1 元数据存储
  milvus-etcd:
    container_name: kb-milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus_etcd_data:/etcd
    command: etcd -advertise-client-urls=http://milvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # 1.2 Milvus 专用对象存储
  #     刻意不映射宿主机端口：它只在容器网络内被 Milvus 访问（milvus-minio:9000），
  #     这样业务 MinIO 才能正常使用 9000 / 9001，避免端口冲突。
  milvus-minio:
    container_name: kb-milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_PASSWORD:-minioadmin}
    volumes:
      - milvus_minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # 1.3 Milvus 主服务
  milvus:
    container_name: kb-milvus
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "${MILVUS_PORT:-19530}:19530"          # gRPC / SDK 连接端口
      - "${MILVUS_METRICS_PORT:-9091}:9091"    # 健康检查 + WebUI（http://localhost:9091/webui/）
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    restart: unless-stopped

  # ===========================================================================
  #  2. Neo4j 知识图谱（5.26 为 LTS 长期支持版）
  #     NEO4J_AUTH 必须是 <用户名>/<密码> 格式，首次启动时会写入。
  #     如需启用 APOC 插件，在 environment 追加：NEO4J_PLUGINS: '["apoc"]'
  # ===========================================================================
  neo4j:
    container_name: kb-neo4j
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-dev_only_password}
      # 内存上限按开发机配置，机器内存紧张可调小
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"        # Browser 界面 http://localhost:7474
      - "${NEO4J_BOLT_PORT:-7687}:7687"        # Bolt 驱动端口
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ===========================================================================
  #  3. MongoDB 会话历史
  #     项目只用到 insert_one / update_one / find，无需副本集，单节点即可。
  #
  #     端口默认映射为 27018：很多开发机已装了本机 MongoDB（占用 27017），
  #     直接映射 27017 会导致 docker compose up 因端口冲突整体失败。
  #
  #     - 本机没有 MongoDB，想用标准端口：MONGO_PORT=27017 docker compose up -d
  #     - 本机已有 MongoDB 想继续用：直接跳过本服务
  #       docker compose up -d milvus neo4j minio minio-init
  #       （.env 里 MONGO_URL 保持 mongodb://localhost:27017）
  # ===========================================================================
  mongodb:
    container_name: kb-mongodb
    image: mongo:7.0
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-kb001}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "${MONGO_PORT:-27018}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ===========================================================================
  #  4. 业务 MinIO（图片 / 文件存储）
  #     项目按 http://<endpoint>/<bucket>/<object> 直拼公网访问地址，
  #     因此桶必须设为公开读（anonymous download），否则图片无法访问。
  # ===========================================================================
  minio:
    container_name: kb-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: minio server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"         # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001"     # 控制台 http://localhost:9001
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # 4.1 一次性初始化容器：建桶 + 设为公开读，执行完自动退出（restart: no）
  minio-init:
    container_name: kb-minio-init
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET_NAME:-shopkeeper-kb}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        echo "等待 MinIO 可连接 ..."
        until mc alias set kbminio http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
          sleep 2
        done
        mc mb --ignore-existing "kbminio/$$MINIO_BUCKET"
        mc anonymous set download "kbminio/$$MINIO_BUCKET"
        echo "MinIO 初始化完成：桶 $$MINIO_BUCKET 已就绪（公开读）"
    restart: "no"

# =============================================================================
#  数据卷：使用命名卷而非目录挂载，跨平台一致（避免 Windows 下的文件权限问题）
#  彻底清理数据：docker compose down -v
# =============================================================================
volumes:
  milvus_etcd_data:
  milvus_minio_data:
  milvus_data:
  neo4j_data:
  neo4j_logs:
  mongodb_data:
  minio_data:
